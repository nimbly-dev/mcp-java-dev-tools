spring:
  main:
    banner-mode: "off"
    web-application-type: "none"
  ai:
    mcp:
      server:
        name: "mcp-java-dev-tools"
        version: "0.1.9"
        type: "SYNC"
        stdio: true
        annotation-scanner:
          enabled: true
        capabilities:
          resource: true
          tool: true
          prompt: false
          completion: false

logging:
  level:
    root: INFO

mcpjvm:
  jvm-lifecycle:
    artifacts:
      helper-jar: ${MCP_JAVA_ATTACH_HELPER_JAR:}
      agent-jar: ${MCP_JAVA_AGENT_JAR:}
    java-bin: ${MCP_JAVA_BIN:java}
    allowed-probe-hosts: ${MCP_JVM_LIFECYCLE_ALLOWED_PROBE_HOSTS:}
  probe:
    registry:
      allow-non-wrapped-executable: false
    endpoint:
      timeout-ms: 15000
      poll-interval-ms: 500
      max-retries: 1
      unreachable-retry-enabled: false
      unreachable-max-retries: 3
      maximum-response-payload-bytes: 1048576
    capture:
      response:
        include-execution-paths: false
        max-string-length: 256
        max-execution-paths: 32
  transport-execution:
    http:
      allowed-hosts: []
  route-synthesis:
    synthesizer:
      external-modules: ${MCP_SYNTHESIZER_PLUGIN_MODULES:}
    runtime-mappings-allowed-hosts:
      - 127.0.0.1
      - localhost
      - ::1
    runtime-mappings-max-response-bytes: 1048576
  failure-analysis:
    endpoint:
      timeout-ms: 15000
      maximum-trace-characters: 200000
      maximum-response-payload-bytes: 1048576
      maximum-string-length: 256
      maximum-frames: 32
      maximum-sections: 16
