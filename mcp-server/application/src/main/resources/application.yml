spring:
  main:
    banner-mode: "off"
    web-application-type: "none"
  ai:
    mcp:
      server:
        name: "mcp-java-dev-tools"
        version: "0.1.9"
        type: "SYNC"
        stdio: true
        annotation-scanner:
          enabled: true
        capabilities:
          resource: true
          tool: true
          prompt: false
          completion: false

logging:
  level:
    root: INFO

mcpjvm:
  probe:
    endpoint:
      timeout-ms: 15000
      poll-interval-ms: 500
      max-retries: 1
      unreachable-retry-enabled: false
      unreachable-max-retries: 3
      maximum-response-payload-bytes: 1048576
    capture:
      response:
        include-execution-paths: false
        max-string-length: 256
        max-execution-paths: 32
